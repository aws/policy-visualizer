name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: the workflow builds and tests, and never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs; the comment shows the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from the lock file
        run: npm ci
      - name: Check runtime dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep browser test output when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-output
          path: e2e/.output/
          retention-days: 7
