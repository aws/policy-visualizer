<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Simple self-made favicon (inline SVG): three linked diagram nodes. Not an AWS asset. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1020'/%3E%3Cpath d='M11 16 L21 9 M11 16 L21 23' stroke='%235bb8ff' stroke-width='2'/%3E%3Ccircle cx='9' cy='16' r='4' fill='%239cc2ff'/%3E%3Ccircle cx='22' cy='9' r='3' fill='%2329c26b'/%3E%3Ccircle cx='22' cy='23' r='3' fill='%23f76363'/%3E%3C/svg%3E" />

    <meta
      name="description"
      content="Policy Visualizer for AWS - visualize IAM policy JSON as an interactive diagram, entirely in the browser."
    />
    <title>Policy Visualizer for AWS</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial; background:#0b1020; color:#eaeef7; }
      .app { display:flex; height:100%; }
      .sidebar { width: 460px; border-right:1px solid #1c2442; padding: 16px; background:#0f1630; overflow:auto; }
      .main { flex:1; display:flex; flex-direction:column; min-height: 0;}
      .toolbar { display:flex; gap:8px; padding:10px 12px; border-bottom:1px solid #1c2442; background:#0f1630; align-items:center; }
      .toolbar h1 { font-size:16px; flex:1; margin:0; color:#9cc2ff;}
      .btn { background:#1a4fff; border: none; padding:8px 12px; border-radius:10px; color:white; cursor:pointer; }
      .btn.secondary{ background:#22315f; }
      .btn:disabled{ opacity:.6; cursor:not-allowed;}
      .panel { margin-bottom:16px; background:#0b1228; border:1px solid #1c2442; border-radius:12px; padding:12px; }
      .panel h3 { margin:0 0 8px 0; font-size:15px; color:#c6d3ff;}
      textarea { width:100%; min-height:160px; border-radius:10px; padding:10px; background:#0a1430; color:#eaeef7; border:1px solid #1c2442; }
      input[type="file"] { width:100%; }
      .rf-wrapper { flex:1; min-height: 0;}
      .note { font-size:13px; color:#9aa7c3; }
      .foot { padding:8px 12px; font-size:13px; color:#88a;}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
